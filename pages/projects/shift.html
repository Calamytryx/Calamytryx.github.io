<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>shift.mk — productivity tracker</title>
<link rel="icon" href="/assets/media/logo.png">
<link rel="stylesheet" href="/my_css.css">
<script src="/assets/layout/cursors.js" defer></script>
<style>
.toolbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;padding:12px 18px;border-bottom:2px solid var(--line);background:var(--panel)}
.toolbar h1{font-family:var(--display);font-size:15px;color:var(--txt);letter-spacing:1px}
.toolbar h1 span{color:var(--blood)}
.toolbar .tbsub{color:var(--dim);font-size:11px}
.toolbar a{font-size:12px}
.toolbar-end{display:flex;gap:10px;align-items:center;margin-left:auto}
.themebar{display:flex;gap:6px;align-items:center}
.themebar button{width:18px;height:18px;border:0;padding:0;cursor:pointer;outline:2px solid var(--line);outline-offset:2px;border-radius:0}
.themebar button.on{outline-color:var(--blood);outline-width:3px}
main.wrap{padding-top:24px;padding-bottom:60px;max-width:980px}
input,select{background:var(--panel2);border:2px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:12px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--blood)}
input:disabled,select:disabled{opacity:.35}
input[type=color]{width:44px;height:32px;padding:2px;cursor:pointer}
.btn.sm{font-size:.75rem;padding:6px 12px;box-shadow:3px 3px 0 #000}
.btn.sm:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.hint{color:var(--dim);font-size:11px}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.addrow,.row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:flex;border:2px solid var(--line)}
.seg button{background:none;border:0;color:var(--dim);font-family:var(--mono);font-size:.75rem;padding:6px 12px;text-transform:uppercase}
.seg button.on{background:var(--blood);color:var(--bg)}
.mod{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.sub_t{color:var(--blood);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;border-top:1px solid var(--line);padding-top:12px}
.num{width:90px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--blood);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;font-weight:400}
.n{text-align:right}
tr[data-open]:hover td{background:var(--panel2)}
.th{display:flex;gap:8px;align-items:center}
.th i{display:inline-block;width:14px;height:14px;outline:1px solid #555}
.th.on{outline:2px solid var(--blood);outline-offset:1px}
.cc2{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.ot_row{background:var(--panel2);border:1px solid var(--line);padding:8px 12px;border-radius:0}
.ot_row .hint{color:var(--dim)}
.ot_badge{display:inline-block;font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;margin-left:6px;border:1px solid var(--blood);color:var(--blood)}
tr.ot td:first-child::after{content:' OT';font-size:9px;color:var(--blood);margin-left:4px;letter-spacing:1px}

.sheetwrap{overflow:auto;max-height:72vh;border:2px solid var(--line)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content;min-width:100%;counter-reset:rn}
.sheet th,.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 8px;height:26px;box-sizing:border-box;white-space:nowrap}
.sheet td{background:var(--bg)}
.sheet thead th{position:sticky;background:var(--panel);z-index:2}
.sheet thead tr:first-child th{top:0;height:20px;color:var(--dim);text-align:center;font-size:10px;letter-spacing:0}
.sheet thead tr:nth-child(2) th{top:20px}
.sheet .rn{width:44px;min-width:44px;text-align:center;color:var(--dim);font-size:10px;background:var(--panel);position:sticky;left:0;z-index:1}
.sheet thead .rn{z-index:3}
.sheet tbody tr{counter-increment:rn}
.sheet tbody .rn::before{content:counter(rn)}
.sheet tbody tr:hover td:not(.rn){background:var(--panel2)}
.sheet input,.sheet select{border:0;background:transparent;width:100%;min-width:62px;height:24px;padding:0;box-sizing:border-box}
.sheet td:focus-within{outline:2px solid var(--blood);outline-offset:-2px}
.sheet tr.tot td{background:var(--panel);font-weight:700;border-top:1px solid var(--blood)}
.sheet tr.tot td.rn{background:var(--panel)}
.sheet tr.empty .cv{color:var(--dim)}
.sheet td.lnk{cursor:pointer;color:var(--blood);text-decoration:underline}
.sheet td.n{text-align:right}

.ovgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0 16px}
.ovbig{font-family:var(--display);font-size:clamp(2.6rem,10vw,4.6rem);line-height:1;letter-spacing:2px;font-variant-numeric:tabular-nums}
.ovbig2{font-family:var(--display);font-size:clamp(2rem,6vw,3rem);line-height:1;font-variant-numeric:tabular-nums}
.ovmid{font-family:var(--display);font-size:1.15rem}
.ovbar{height:8px;border:1px solid var(--line);background:var(--panel2)}
.ovbar i{display:block;height:100%;width:0;background:var(--blood)}
#ov b{color:var(--txt);font-weight:700}
</style>
</head>
<body data-page="projects">

<header class="toolbar">
<h1>shift<span>.</span>mk</h1>
<span class="tbsub">tickets per hour · quotas · sheets export — saved in this browser</span>
<div class="toolbar-end">
  <div class="themebar" id="themebar"></div>
  <a href="#" data-data title="backup / restore">data</a>
  <a href="tally.html">tally.mk →</a>
  <a href="index.html">← projects</a>
</div>
</header>

<main class="wrap" id="main"></main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const KEY = 'shift.v1';
const p2 = n => String(n).padStart(2,'0');
const uid = () => Math.random().toString(36).slice(2,8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f2 = n => (Math.round(n*100)/100).toFixed(2);
const tph = (t,h) => h > 0 ? t/h : 0;

/* ---------- dates / times ---------- */
const ymd = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const pd = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ymd(d); };
const span = (a,b) => { const o = []; for(let x=a; x<=b; x=addD(x,1)) o.push(x); return o; };
function range(view, s){
  if(view==='day') return [s];
  const d = pd(s); let a, b;
  if(view==='week'){ a = addD(s, -((d.getDay()+6)%7)); b = addD(a,6); }
  else { a = ymd(new Date(d.getFullYear(), d.getMonth(), 1)); b = ymd(new Date(d.getFullYear(), d.getMonth()+1, 0)); }
  return span(a,b);
}
const tm = s => { const [a,b] = s.split(':').map(Number); return a*60+b; };
const ft = m => { m = ((m % 1440) + 1440) % 1440; return p2(Math.floor(m/60))+':'+p2(m%60); };

/* ---------- workbook themes ---------- */
const rgb = h => [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));
const mix = (a,b,t) => { const x = rgb(a), y = rgb(b); return x.map((v,i)=>Math.round(v*(1-t)+y[i]*t).toString(16).padStart(2,'0')).join(''); };
const lum = h => { const [r,g,b] = rgb(h).map(v=>v/255); return .2126*r+.7152*g+.0722*b; };
const hex6 = (v,d) => /^[0-9a-f]{6}$/i.test(v||'') ? v.toLowerCase() : d;
const PRESETS = [
  {id:'site',  name:'shift.mk', bg:'0b0b0c', panel:'141416', txt:'e6e6e6', acc:'e11d2e'},
  {id:'ocean', name:'Ocean',    bg:'0a1620', panel:'0f2230', txt:'dbe9f3', acc:'38bdf8'},
  {id:'forest',name:'Forest',   bg:'0b140e', panel:'111d15', txt:'dfeee3', acc:'34d399'},
  {id:'amber', name:'Amber',    bg:'140e06', panel:'1d1409', txt:'f3e8d7', acc:'f59e0b'},
  {id:'violet',name:'Violet',   bg:'0f0b1a', panel:'171226', txt:'ece8fa', acc:'a78bfa'},
  {id:'mono',  name:'Mono',     bg:'0e0e0e', panel:'161616', txt:'ededed', acc:'ffffff'},
  {id:'paper', name:'Paper',    bg:'f1eee7', panel:'ffffff', txt:'1c1c1c', acc:'c21f30'}
];
const pal = t => ({id:t.id, name:t.name, bg:t.bg, panel:t.panel, txt:t.txt, acc:t.acc,
  panel2:mix(t.panel,t.txt,.07), line:mix(t.panel,t.txt,.2), dim:mix(t.txt,t.panel,.5)});
const thm = id => id==='custom' ? pal(Object.assign({id:'custom', name:'Custom'}, S.custom)) : pal(PRESETS.find(t=>t.id===id) || PRESETS[0]);

function applyTheme(){
  const p = thm(S.theme);
  let st = document.getElementById('theme-style');
  if(!st){ st = document.createElement('style'); st.id = 'theme-style'; document.head.appendChild(st); }
  st.textContent =
    ':root{--bg:#'+p.bg+';--panel:#'+p.panel+';--panel2:#'+p.panel2+';--txt:#'+p.txt+';--dim:#'+p.dim+';--line:#'+p.line+';--blood:#'+p.acc+';}'+
    'body{background:var(--bg)!important;color:var(--txt);}';
}
function renderThemebar(){
  const bar = $('themebar'); if(!bar) return;
  const cur = S.theme;
  const mk = (id, bg, acc, name) => '<button data-th="'+id+'" class="'+(id===cur?'on':'')+'" style="background:linear-gradient(135deg,#'+bg+' 0%,#'+bg+' 50%,#'+acc+' 50%,#'+acc+' 100%)" title="'+name+'"></button>';
  bar.innerHTML = PRESETS.map(t=>mk(t.id, t.bg, t.acc, t.name)).join('') + mk('custom', S.custom.bg, S.custom.acc, 'Custom');
}

/* ---------- state ---------- */
const DEF = {
  cfg:{start:'09:00', end:'18:00', interval:30},
  theme:'site',
  custom:{bg:'0b0b0c', panel:'141416', txt:'e6e6e6', acc:'e11d2e'},
  tags:[{id:'g1',name:'Task 1',prod:true,mins:null,quota:10},{id:'g5',name:'Task 2',prod:true,mins:null,quota:null},
        {id:'g2',name:'Break (15 min)',prod:false,mins:15,quota:null},
        {id:'g3',name:'Lunch',prod:false,mins:null,quota:null},{id:'g4',name:'Idle',prod:false,mins:null,quota:null}],
  breaks:[], days:{}
};
function migrate(o){
  o.tags = o.tags || [];
  if(!Array.isArray(o.tasks)) return o;
  const map = {};
  for(const t of o.tasks){
    let g = o.tags.find(x=>x.prod && x.name===t.name);
    if(!g){ g = {id:t.id, name:t.name, prod:true, mins:null, quota:t.quota ?? null}; o.tags.push(g); }
    else if(g.quota==null) g.quota = t.quota ?? null;
    map[t.id] = g.id;
  }
  for(const d in (o.days||{})) for(const k in ((o.days[d]||{}).slots||{})){
    const x = o.days[d].slots[k], cur = o.tags.find(q=>q.id===x.tag);
    if(x.task && map[x.task] && cur && cur.prod) x.tag = map[x.task];
    delete x.task;
  }
  delete o.tasks; return o;
}
function hydrate(o){
  o = migrate(o);
  const r = Object.assign(structuredClone(DEF), o, {cfg:Object.assign({}, DEF.cfg, o.cfg)});
  r.custom = {}; for(const k in DEF.custom) r.custom[k] = hex6((o.custom||{})[k], DEF.custom[k]);
  r.tags.forEach(t=>{ if(t.quota===undefined) t.quota = null; });
  return r;
}
function load(){
  try{ const o = JSON.parse(localStorage.getItem(KEY)); if(o && o.days) return hydrate(o); }catch(_){}
  return structuredClone(DEF);
}
let S = load();
const ui = {tab:'overview', view:'day', date:ymd(new Date()), xmode:'logged'};
const save = () => { if(window.__mkSkip) return; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(_){} };
window.addEventListener('pagehide', save);

/* ---------- computation ---------- */
const shift = d => ({start:(S.days[d] && S.days[d].start) || S.cfg.start, end:(S.days[d] && S.days[d].end) || S.cfg.end});
const slot = (d,k) => (S.days[d] && S.days[d].slots[k]) || {};
const prodTags = () => S.tags.filter(t=>t.prod);

const otOf = (d, key) => ((S.days[d] || {})[key] || 0);
function setOT(d, key, mins){
  mins = Math.max(0, Math.min(1440, Math.round(mins || 0)));
  if(key === 'preOT') mins = Math.min(mins, tm(shift(d).start));
  const day = S.days[d] || (S.days[d] = {slots:{}});
  if(mins > 0) day[key] = mins;
  else delete day[key];
  save();
}

function shiftSpan(d){
  const sh = shift(d);
  const preOT = otOf(d, 'preOT'), postOT = otOf(d, 'postOT');
  const a = Math.max(0, tm(sh.start) - preOT);
  let b = tm(sh.end) + postOT;
  if(b <= a) b += 1440;
  return { a, b, preOT, postOT, baseStart: sh.start, baseEnd: sh.end };
}

/* BUG FIX: handle shifts that cross midnight (e.g. 23:00 → 08:00) so 'be' matches
   the extended-minutes scale used by the grid. Otherwise every slot has s >= be
   and gets wrongly flagged as post-OT. */
function slotZone(d, s, e){
  const sh = shift(d);
  let bs = tm(sh.start), be = tm(sh.end);
  if(be <= bs) be += 1440;
  if(e <= bs) return 'pre';
  if(s >= be) return 'post';
  return '';
}

function ivOf(d){ return Math.max(1, +((S.days[d]||{}).iv) || +S.cfg.interval || 30); }
function grid(d){
  const sp = shiftSpan(d), iv = ivOf(d);
  const a = sp.a, b = sp.b;
  const o = [];
  for(let t=a; t<b; t+=iv) o.push({k:ft(t), s:t, e:Math.min(t+iv,b), def:Math.min(iv,b-t), zone:slotZone(d, t, Math.min(t+iv,b))});
  return o;
}
function breaksInInterval(d, g){
  const sp = shiftSpan(d);
  const a = sp.a, b = sp.b;
  const out = [];
  for(const br of S.breaks){
    if(!br.start) continue;
    const bm = +br.mins || 0; if(bm <= 0) continue;
    let bs = tm(br.start);
    if(bs < a) bs += 1440;
    if(bs >= b) continue;
    const be = bs + bm;
    const os = Math.max(g.s, bs), oe = Math.min(g.e, be);
    if(oe > os) out.push({name: br.name, overlap: oe - os, total: bm});
  }
  return out;
}
function breakOverlap(d, g){ let m = 0; for(const b of breaksInInterval(d, g)) m += b.overlap; return m; }
function effMin(d, g){ return Math.max(0, g.def - breakOverlap(d, g)); }

function sl(d,g){
  const x = slot(d,g.k), tag = S.tags.find(t=>t.id===x.tag); if(!tag) return null;
  const def = effMin(d, g);
  const m = x.mins==null ? def : Math.min(Math.max(0,x.mins), g.def), pr = !!tag.prod;
  return {tag, m, h:m/60, ded:(g.def-m)/60, pr, tk:pr?(+x.tickets||0):0};
}
function stats(d){
  const R = {d, tk:0, ph:0, lh:0, dh:0, sh:0, task:{}, tag:{}};
  for(const g of grid(d)){ const v = sl(d,g); if(!v) continue;
    R.lh += v.h; R.dh += v.ded; R.tag[v.tag.id] = (R.tag[v.tag.id]||0) + v.h;
    if(v.pr){ R.ph += v.h; R.tk += v.tk; const o = R.task[v.tag.id] || (R.task[v.tag.id] = {tk:0,h:0}); o.tk += v.tk; o.h += v.h; } }
  const sp = shiftSpan(d);
  R.sh = (sp.b - sp.a) / 60;
  return R;
}
function agg(ds){
  const R = {tk:0, ph:0, lh:0, dh:0, sh:0, task:{}, tag:{}, rows:ds.map(stats)};
  for(const r of R.rows){
    for(const k of ['tk','ph','lh','dh','sh']) R[k] += r[k];
    for(const k in r.task){ const o = R.task[k] || (R.task[k] = {tk:0,h:0}); o.tk += r.task[k].tk; o.h += r.task[k].h; }
    for(const k in r.tag) R.tag[k] = (R.tag[k]||0) + r.tag[k];
  }
  return R;
}

/* ---------- views ---------- */
function tagOpt(sel){
  const o = t => '<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+(t.prod&&t.quota?' · '+t.quota+'/h':'')+'</option>';
  const pr = S.tags.filter(t=>t.prod), ot = S.tags.filter(t=>!t.prod);
  return '<option value="">—</option>'+(pr.length?'<optgroup label="productive">'+pr.map(o).join('')+'</optgroup>':'')+(ot.length?'<optgroup label="other">'+ot.map(o).join('')+'</optgroup>':'');
}

function render(){
  const body = {overview:vOverview, track:vTrack, sheet:vSheet, setup:vSetup, export:vExport}[ui.tab]();
  $('main').innerHTML = '<div class="bar"><div class="seg">'+['overview','track','sheet','setup','export'].map(t=>'<button data-tab="'+t+'" class="'+(ui.tab===t?'on':'')+'">'+t+'</button>').join('')+'</div></div>'+body;
  if(ui.tab==='track') calc(); else if(ui.tab==='sheet') sheetCalc(); else if(ui.tab==='overview') ovCalc();
}

function vTrack(){
  const ds = range(ui.view, ui.date);
  const lab = ui.view==='day' ? pd(ui.date).toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'short',day:'numeric'}) : ds[0]+' → '+ds[ds.length-1];
  return '<div class="bar"><div class="seg">'+['day','week','month'].map(v=>'<button data-view="'+v+'" class="'+(ui.view===v?'on':'')+'">'+v+'</button>').join('')+'</div>'+
    '<div class="addrow"><button class="btn sm ghost" data-nav="-1">‹</button><input type="date" id="dt" value="'+ui.date+'"><button class="btn sm ghost" data-nav="1">›</button><button class="btn sm ghost" data-today>today</button></div></div>'+
    '<p class="hint" style="margin-bottom:12px">'+lab+'</p>'+(ui.view==='day'?dayBody():'')+'<div id="sum"></div>';
}

function otControls(d){
  const preOT = otOf(d, 'preOT'), postOT = otOf(d, 'postOT');
  const parts = ['<span class="hint">overtime</span>'];
  if(preOT > 0){
    parts.push('<input type="number" id="preOT" min="0" max="24" step="0.5" value="'+(preOT/60)+'" style="width:70px" title="pre-shift overtime (hours)">');
    parts.push('<span class="hint">h pre</span>');
    parts.push('<button class="btn sm ghost" data-ot="pre-rm" title="remove pre-shift overtime">×</button>');
  } else {
    const suggest = postOT > 0 ? 2 : 4;
    parts.push('<button class="btn sm ghost" data-ot="pre-add" data-h="'+suggest+'">+ pre-OT ('+suggest+'h)</button>');
  }
  parts.push('<span class="hint">·</span>');
  if(postOT > 0){
    parts.push('<input type="number" id="postOT" min="0" max="24" step="0.5" value="'+(postOT/60)+'" style="width:70px" title="post-shift overtime (hours)">');
    parts.push('<span class="hint">h post</span>');
    parts.push('<button class="btn sm ghost" data-ot="post-rm" title="remove post-shift overtime">×</button>');
  } else {
    const suggest = preOT > 0 ? 2 : 4;
    parts.push('<button class="btn sm ghost" data-ot="post-add" data-h="'+suggest+'">+ post-OT ('+suggest+'h)</button>');
  }
  return '<div class="row2 ot_row">'+parts.join('')+'</div>';
}

function dayBody(){
  const d = ui.date, sh = shift(d);
  const sp = shiftSpan(d);
  const totalSpan = (sp.b - sp.a)/60;
  const otInfo = (sp.preOT || sp.postOT) ? '<span class="ot_badge">'+(sp.preOT?'-'+f2(sp.preOT/60)+'h pre':'')+(sp.preOT && sp.postOT?' ':'')+(sp.postOT?'+'+f2(sp.postOT/60)+'h post':'')+'</span>' : '';
  const rows = grid(d).map(g=>{
    const x = slot(d,g.k), bo = breaksInInterval(d, g), def = effMin(d, g);
    const bn = bo.map(b => esc(b.name) + ' −' + b.overlap + 'm').join(', ');
    const otCls = g.zone ? ' class="ot"' : '';
    return '<tr'+otCls+' data-k="'+g.k+'"><td>'+g.k+'–'+ft(g.e)+'</td>'+
      '<td><select data-f="tag">'+tagOpt(x.tag)+'</select></td>'+
      '<td><input type="number" data-f="tickets" min="0" step="1" style="width:70px" value="'+(x.tickets??'')+'"></td>'+
      '<td><input type="number" data-f="mins" min="0" max="'+g.def+'" step="1" style="width:64px" placeholder="'+def+'" value="'+(x.mins??'')+'"></td>'+
      '<td class="cc n"></td><td class="hint">'+(bn?'sched: '+bn:'')+'</td></tr>';
  }).join('');
  return '<div class="panel mod"><div class="row2"><span class="hint">shift</span><input type="time" id="ss" value="'+sh.start+'"><span class="hint">to</span><input type="time" id="se" value="'+sh.end+'">'+otInfo+
    '<span class="hint">· '+ivOf(d)+' min slots · '+f2(totalSpan)+' h span · tickets only count on productive tags</span></div>'+
    otControls(d)+
    '<div class="scroll"><table><tr><th>slot</th><th>tag</th><th class="n">tickets</th><th class="n">mins</th><th class="n">hours</th><th></th></tr>'+rows+'</table></div></div>';
}

function calc(){
  if(ui.view==='day'){
    const d = ui.date;
    for(const g of grid(d)){
      const tr = document.querySelector('tr[data-k="'+g.k+'"]'); if(!tr) continue;

/* ---------- overview (live dashboard) ---------- */
const hms = min => { let t = Math.max(0, Math.floor(min*60)); const h = Math.floor(t/3600); t %= 3600; return h+':'+p2(Math.floor(t/60))+':'+p2(t%60); };
/* the shift that is running right now (a 23:00 -> 08:00 shift is still "yesterday's" at 02:00) */
function activeDay(){
  const n = new Date(), min = n.getHours()*60 + n.getMinutes() + n.getSeconds()/60, t = ymd(n), y = addD(t,-1), sp = shiftSpan(y);
  if(sp.b > 1440 && min+1440 >= sp.a && min+1440 < sp.b) return {d:y, rel:min+1440, now:n};
  return {d:t, rel:min, now:n};
}
function ovModel(){
  const {d, rel, now} = activeDay(), sp = shiftSpan(d), gr = grid(d), St = stats(d);
  const cur = gr.find(g => rel >= g.s && rel < g.e) || null;
  /* open time = not-yet-tagged time from now to the end, minus scheduled breaks */
  let hRem = 0, openSlots = 0;
  for(const g of gr){
    if(g.e <= rel || slot(d,g.k).tag) continue;
    const lo = Math.max(g.s, rel);
    const br = breaksInInterval(d, {s:lo, e:g.e}).reduce((a,b) => a + b.overlap, 0);
    hRem += Math.max(0, (g.e - lo) - br) / 60; openSlots++;
  }
  const Tq = prodTags().filter(t => +t.quota > 0);
  let done = 0, soFar = 0;
  for(const t of Tq){ const o = St.task[t.id] || {tk:0,h:0}; done += o.tk; soFar += t.quota * o.h; }
  const ctag = cur && S.tags.find(t => t.id === slot(d,cur.k).tag);
  let prim = ctag && ctag.prod && +ctag.quota > 0 ? ctag : null;
  if(!prim) prim = Tq.slice().sort((a,b) => ((St.task[b.id]||{}).h||0) - ((St.task[a.id]||{}).h||0))[0] || null;
  const target = soFar + (prim ? prim.quota * hRem : 0);
  const remaining = Tq.length ? Math.max(0, Math.ceil(target - done - 1e-9)) : null;
  return {d, rel, now, sp, cur, St, hRem, openSlots, Tq, done, soFar, prim, target, remaining};
}

function ovCalc(){
  if(!$('ov')) return;
  const M = ovModel(), n = M.now, sp = M.sp, d = M.d;
  const set = (id, v) => { const e = $('ov-'+id); if(e && e.textContent !== String(v)) e.textContent = v; };
  set('clock', p2(n.getHours())+':'+p2(n.getMinutes())+':'+p2(n.getSeconds()));
  set('date', n.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}));
  /* shift */
  const total = sp.b - sp.a, left = sp.b - M.rel;
  set('shift-day', d === ymd(n) ? 'today' : 'started '+pd(d).toLocaleDateString(undefined,{weekday:'long'}));
  set('shift-range', ft(sp.a)+' \u2013 '+ft(sp.b)+((sp.preOT||sp.postOT) ? '  \u00b7  OT '+(sp.preOT?'\u2212'+f2(sp.preOT/60)+'h pre':'')+(sp.preOT&&sp.postOT?' ':'')+(sp.postOT?'+'+f2(sp.postOT/60)+'h post':'') : ''));
  if(M.rel < sp.a){ set('shift-lab','starts in'); set('shift-left', hms(sp.a - M.rel)); }
  else if(left > 0){ set('shift-lab','remaining'); set('shift-left', hms(left)); }
  else { set('shift-lab','shift over'); set('shift-left','0:00:00'); }
  const bar = $('ov-shift-bar'); if(bar) bar.style.width = Math.max(0, Math.min(100, (M.rel - sp.a) / total * 100)).toFixed(1)+'%';
  /* current slot */
  if(M.cur){
    const x = slot(d, M.cur.k), tag = S.tags.find(t => t.id === x.tag);
    set('slot-range', ft(M.cur.s)+' \u2013 '+ft(M.cur.e)+(M.cur.zone ? '  \u00b7  '+M.cur.zone.toUpperCase()+'-OT' : ''));
    set('slot-left', hms(M.cur.e - M.rel));
    set('slot-tag', tag ? 'tag: '+tag.name+(tag.prod ? '' : ' (not productive)') : 'no tag yet');
    set('slot-tk', +x.tickets || 0);
  } else {
    set('slot-range','\u2014'); set('slot-left','\u2014'); set('slot-tag','outside the shift'); set('slot-tk', 0);
  }
  /* quota */
  if(M.remaining === null){
    set('q-remaining','\u2014'); set('q-prog',''); set('q-need',''); set('q-slot',''); set('q-diff','');
    set('q-note','No quota set. Give a productive tag a quota/h in setup.');
  } else {
    set('q-remaining', M.remaining);
    set('q-prog', Math.round(M.done)+' done of '+Math.ceil(M.target - 1e-9)+' expected by end of shift');
    if(M.remaining === 0){ set('q-need','quota met'); set('q-slot',''); }
    else if(M.hRem > 0){
      set('q-need', (M.remaining / M.hRem).toFixed(1)+' tickets / hr for the open '+f2(M.hRem)+' h');
      set('q-slot', 'about '+Math.ceil(M.remaining / Math.max(1, M.openSlots))+' per open slot ('+M.openSlots+' left)');
    } else { set('q-need','no open time left'); set('q-slot',''); }
    const diff = M.done - M.soFar;
    set('q-diff', (diff >= 0 ? '+' : '\u2212')+Math.abs(Math.round(diff))+' vs quota for the hours logged so far');
    set('q-note', M.prim ? 'assumes '+M.prim.name+' ('+M.prim.quota+'/h) for the open time' : '');
  }
  /* today */
  set('day-tk', M.St.tk); set('day-ph', f2(M.St.ph)); set('day-tp', M.St.ph ? f2(M.St.tk / M.St.ph) : '\u2014');
}

function sheetCalc(){

function anchorOf(){
  const m = /^([A-Za-z]+)(\d+)$/.exec(String(ui.sa || 'A1').trim());
  if(!m) return {c:0, r:1};
  let c = 0; for(const ch of m[1].toUpperCase()) c = c*26 + ch.charCodeAt(0) - 64;
  return {c:c-1, r:Math.max(1, +m[2])};
}

async function copyFormulas(){
  const A = anchorOf(), T = prodTags(), nT = T.length, mode = ui.smode || 'days';

      ...T.map(t=>t.name+' tickets'), ...T.map(t=>t.name+' hours'), ...T.map(t=>t.name+' quota %'));
    const first = A.r + 1; let row = first;
    for(const d of range(ui.view, ui.date)){

        '=MOD('+q(3)+'-'+q(2)+',1)*24+'+q(4)+'+'+q(5),
        r4(St.lh), r4(St.ph), r4(St.dh), St.tk,
        '=IFERROR('+q(10)+'/'+q(8)+')'];
      T.forEach(t => line.push((St.task[t.id]||{}).tk || 0));
      T.forEach(t => line.push(r4((St.task[t.id]||{}).h || 0)));
      T.forEach((t,i) => line.push(t.quota ? '=IFERROR('+q(12+i)+'/('+(+t.quota)+'*'+q(12+nT+i)+')*100)' : ''));
      out.push(line); row++;
    }

      const last = row - 1, tot = row, rng = ci => R(ci,first)+':'+R(ci,last), sum = ci => '=SUM('+rng(ci)+')';
      const line = ['TOTAL','','','', sum(4), sum(5), sum(6), sum(7), sum(8), sum(9), sum(10), '=IFERROR('+R(10,tot)+'/'+R(8,tot)+')'];
      T.forEach((t,i) => line.push(sum(12+i)));
      T.forEach((t,i) => line.push(sum(12+nT+i)));
      T.forEach((t,i) => line.push(t.quota ? '=IFERROR('+R(12+i,tot)+'/('+(+t.quota)+'*'+R(12+nT+i,tot)+')*100)' : ''));
      out.push(line);
    }
  } else {
    head.push('DATE','SLOT','TAG','TICKETS','MINS','HOURS','DEDUCTED','PROD (1/0)','PROD HRS','T / HR','NOTE');
    const first = A.r + 1; let row = first;
    for(const d of range(ui.view, ui.date)){
      for(const g of grid(d)){
        const v = sl(d,g); if(!v) continue;
        const x = slot(d,g.k), eff = effMin(d,g), bn = breaksInInterval(d,g).map(b => b.name+' -'+b.overlap+'m').join(', ');
        const mins = R(4,row), blank = 'IF(ISBLANK('+mins+'),'+eff+','+mins+')';
        out.push([d, g.k+'\u2013'+ft(g.e), v.tag.name, v.pr && v.tk ? v.tk : '', x.mins != null ? +x.mins : '',
          '='+blank+'/60',
          '=('+g.def+'-'+blank+')/60',
          v.pr ? 1 : 0,
          '='+R(5,row)+'*'+R(7,row),
          '=IFERROR('+R(3,row)+'*'+R(7,row)+'/'+R(8,row)+')',
          (g.zone ? g.zone.toUpperCase() : '')+(bn ? (g.zone ? ' / ' : '')+'sched: '+bn : '')]);
        row++;
      }
    }
    if(out.length){
      const last = row - 1, tot = row, rng = ci => R(ci,first)+':'+R(ci,last), sum = ci => '=SUM('+rng(ci)+')';
      out.push(['TOTAL','','','=SUMPRODUCT('+rng(3)+','+rng(7)+')','', sum(5), sum(6), '', sum(8), '=IFERROR('+R(3,tot)+'/'+R(8,tot)+')','']);
    }
  }
  if(!out.length) return say('nothing logged in this range');
  const fc = v => (typeof v === 'string' && v.charAt(0) === '=') ? v : cell(v, '\t');
  const text = [head, ...out].map(r => r.map(fc).join('\t')).join('\n');
  const ok = await cp(text);
  say(ok ? 'copied '+(out.length-1)+' rows with formulas \u2014 paste into '+R(0,A.r)+' in Google Sheets' : 'copy blocked');
}
async function copySheet(kind){

function exportDates(a, z, mode){
  if(mode !== 'months') return span(a,z);
  const first = pd(a); first.setDate(1);
  const last = pd(z); last.setMonth(last.getMonth()+1,0);
  return span(ymd(first), ymd(last));
}
async function xlsx(ds, empty){
  if(!empty && !ds.some(d=>stats(d).lh)) return null;
  const wb = buildWb(await loadEx(), ds, empty);
  const nm = 'productivity_'+ds[0]+'_'+ds[ds.length-1]+'_'+thm(S.theme).id+'.xlsx';
  dl(nm, await wb.xlsx.writeBuffer(), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  return nm;
}

/* ---------- sheet: keyboard nav + column paste ---------- */
document.addEventListener('keydown', e=>{
  const t = e.target;
  if(ui.tab !== 'sheet' || !t.closest || !t.closest('#sheetT') || e.ctrlKey || e.metaKey || e.altKey) return;
  const isIn = t.tagName === 'INPUT', isSel = t.tagName === 'SELECT';
  if(!isIn && !isSel) return;
  let dir = 0;
  if(e.key === 'Enter') dir = e.shiftKey ? -1 : 1;
  else if(isIn && e.key === 'ArrowDown') dir = 1;
  else if(isIn && e.key === 'ArrowUp') dir = -1;
  if(!dir) return;
  e.preventDefault();
  const td = t.closest('td'), ci = td.cellIndex, all = [...$('sheetT').tBodies[0].rows];
  let i = all.indexOf(td.parentElement) + dir;
  while(i >= 0 && i < all.length){
    const c = all[i].cells[ci], f = c && c.querySelector('input:not(:disabled),select:not(:disabled)');
    if(f){ f.focus(); try{ f.select(); }catch(_){} return; }
    i += dir;
  }
});
document.addEventListener('paste', e=>{
  const t = e.target;
  if(!t.closest || !t.closest('#sheetT') || t.tagName !== 'INPUT' || !t.dataset.f) return;
  const txt = ((e.clipboardData || window.clipboardData).getData('text') || '').trim();
  if(!/[\n\r]/.test(txt)) return;
  e.preventDefault();
  const vals = txt.split(/\r?\n/).map(l => l.split('\t')[0].trim());
  const ci = t.closest('td').cellIndex, all = [...$('sheetT').tBodies[0].rows];
  let i = all.indexOf(t.closest('tr'));
  for(const v of vals){
    while(i < all.length){
      const f = all[i].cells[ci].querySelector('input[data-f]:not(:disabled)'); i++;
      if(f){ f.value = v; f.dispatchEvent(new Event('change', {bubbles:true})); break; }
    }
  }
});

(function(){
  const KEYS = {t:'tally.v1', s:'shift.v1'};
  const HAS = typeof CompressionStream !== 'undefined';
  const toB64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
    return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
  const fromB64 = b => { b=b.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const s=atob(b), u=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
  const pipe = async (u8, st) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(st)).arrayBuffer());

  async function pack(withHist){
    const o = {};
    for(const k in KEYS){
      const raw = localStorage.getItem(KEYS[k]); if(!raw) continue;
      let v; try{ v = JSON.parse(raw); }catch(_){ continue; }
      if(!withHist && k==='t' && Array.isArray(v.items)) v.items.forEach(i=>{ if(i.history) i.history = []; });
      o[k] = v;
    }
    const u8 = new TextEncoder().encode(JSON.stringify(o));
    return HAS ? 'MK1.'+toB64(await pipe(u8, new CompressionStream('deflate-raw'))) : 'MK0.'+toB64(u8);
  }

  async function unpack(txt){
    txt = txt.trim();
    let o;
    if(/^MK[01]\./.test(txt)){
      let u8 = fromB64(txt.slice(4).replace(/\s+/g,''));
      if(txt[2]==='1') u8 = await pipe(u8, new DecompressionStream('deflate-raw'));
      o = JSON.parse(new TextDecoder().decode(u8));
    } else {
      o = JSON.parse(txt);                                   // legacy formats
      if(o && o.v===1 && o.tally) o = {t:o.tally, s:o.shift};  // old tally bundle
      else if(o && Array.isArray(o.items)) o = {t:o};          // old tally-only
      else if(o && o.days && o.tags) o = {s:o};                // old shift backup
    }
    if(!o || (!o.t && !o.s)) throw new Error('unrecognized backup');
    if(o.t && !Array.isArray(o.t.items)) throw new Error('bad tally data');
    if(o.s && (!o.s.days || !o.s.tags)) throw new Error('bad shift data');
    return o;
  }

  const css = '#mkdlg{background:var(--panel);color:var(--txt);border:2px solid var(--line);padding:18px;width:min(560px,94vw);font-family:var(--mono);font-size:12px}'+
    '#mkdlg::backdrop{background:rgba(0,0,0,.65)}'+
    '#mkdlg h2{font-family:var(--display);font-size:15px;margin:0 0 4px;letter-spacing:1px}'+
    '#mkdlg textarea{width:100%;height:84px;resize:vertical;box-sizing:border-box;background:var(--panel2);border:2px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:11px;padding:8px;word-break:break-all}'+
    '#mkdlg textarea:focus{outline:none;border-color:var(--blood)}'+
    '#mkdlg .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}'+
    '#mkdlg .h{color:var(--dim);font-size:11px}'+
    '#mkdlg .st{min-height:1.2em;font-size:11px;color:var(--dim)}'+
    '#mkdlg .st.ok{color:#34d399}#mkdlg .st.err{color:#f87171}'+
    '#mkdlg .t{color:var(--blood);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin-top:12px}';
  const st = document.createElement('style'); st.textContent = css; document.head.append(st);

  const dlg = document.createElement('dialog'); dlg.id = 'mkdlg';
  dlg.innerHTML =
    '<h2>data backup</h2><div class="h">Backs up tally + shift together. Copy on one side, paste on the other. Works from either page.</div>'+
    '<div class="t">export</div>'+
    '<textarea id="mkx" readonly spellcheck="false"></textarea>'+
    '<div class="r"><button class="btn sm" id="mkcp">copy</button>'+
    '<label class="h"><input type="checkbox" id="mkh"> include history (longer)</label>'+
    '<span class="h" id="mkn"></span></div>'+
    '<div class="t">import</div>'+
    '<textarea id="mki" spellcheck="false" placeholder="paste backup here…"></textarea>'+
    '<div class="r"><button class="btn sm" id="mkgo">import &amp; reload</button>'+
    '<button class="btn sm ghost" id="mkadv" style="display:none">advanced</button>'+
    '<button class="btn sm ghost" id="mkclose" style="margin-left:auto">close</button></div>'+
    '<div class="st" id="mkst"></div>';
  document.body.append(dlg);
  const $$ = id => dlg.querySelector('#'+id);
  const say = (m, c) => { const s=$$('mkst'); s.textContent = m; s.className = 'st '+(c||''); };

  async function fill(){
    const t = await pack($$('mkh').checked);
    $$('mkx').value = t; $$('mkn').textContent = t.length.toLocaleString()+' chars';
  }
  $$('mkh').onchange = fill;
  $$('mkcp').onclick = async () => {
    const t = $$('mkx').value; let ok = false;
    try{ await navigator.clipboard.writeText(t); ok = true; }
    catch(_){ $$('mkx').select(); try{ ok = document.execCommand('copy'); }catch(_2){} }
    say(ok ? 'copied' : 'copy blocked, text is selected, use ctrl/cmd+c', ok ? 'ok' : 'err');
  };
  $$('mkgo').onclick = async () => {
    const t = $$('mki').value.trim(); if(!t) return say('paste something first','err');
    let o; try{ o = await unpack(t); }catch(e){ return say('import failed: '+e.message,'err'); }
    const what = [o.t&&'tally', o.s&&'shift'].filter(Boolean).join(' + ');
    if(!confirm('Replace current '+what+' data in this browser?')) return;
    try{
      if(o.t) localStorage.setItem(KEYS.t, JSON.stringify(o.t));
      if(o.s) localStorage.setItem(KEYS.s, JSON.stringify(o.s));
    }catch(e){ return say('write failed: '+e.message,'err'); }
    window.__mkSkip = true;           // stop pagehide save() from overwriting the import
    say('imported '+what+', reloading…','ok');
    setTimeout(()=>location.reload(), 300);
  };
  $$('mkclose').onclick = () => dlg.close();
  if(window.mkBackupAdvanced){ const a=$$('mkadv'); a.style.display=''; a.onclick=()=>{ dlg.close(); window.mkBackupAdvanced(); }; }
  dlg.addEventListener('click', e => { if(e.target===dlg) dlg.close(); });

  document.addEventListener('click', async e => {
    if(!e.target.closest('[data-data]')) return;
    e.preventDefault();
    if(dlg.open) return;
    $$('mki').value = ''; say('');
    await fill(); dlg.showModal();
  });
})();

/* ---------- boot ---------- */
applyTheme();
renderThemebar();
render();
</script>

</body>
</html>
