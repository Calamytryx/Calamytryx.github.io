      };

      /* ---------- MOD.slot ---------- */
      MOD.slot = (it) => {
        const wrap = h("div", { class: "mod", "data-slot": it.id });

        let sh = readShift();
        if (!sh || !Array.isArray(sh.tags) || !sh.tags.length) {
          wrap.append(
            h("div", { class: "sub_t" }, "time slot"),
            h(
              "div",
              { class: "hint" },
              "No shift.mk data yet. Open shift.mk and set up at least one tag, then come back here.",
            ),
            h(
              "div",
              { class: "row2", style: "margin-top:12px" },
              h(
                "a",
                {
                  href: "shift.html",
                  class: "btn sm",
                  style:
                    "text-decoration:none;color:var(--txt);display:inline-block",
                },
                "open shift.mk →",
              ),
              h(
                "button",
                {
                  class: "btn sm ghost",
                  onclick: () => {
                    const f = readShift();
                    if (f && Array.isArray(f.tags)) {
                      sh = f;
                      render();
                    }
                  },
                },
                "↻ reload",
              ),
            ),
          );
          return wrap;
        }

        if (it.interval == null) it.interval = 1;
        if (!Array.isArray(it.history)) it.history = [];

        const slotBig = h("div", { class: "slot_big" });
        const slotOT = h("span", { class: "slot_ot" });
        const slotMeta = h("div", { class: "slot_meta" });
        const liveTag = h("span", { class: "slot_live" }, "live");
        const cdEl = h(
          "div",
          { class: "slot_cd", "data-slot-timer": it.id },
          "—",
        );

        const dateIn = h("input", { type: "date" });
        const slotSel = h("select");
        const tagSel = h("select");
        const minIn = h("input", {
          type: "number",
          min: "0",
          step: "1",
          style: "width:100px",
        });
        const minHint = h("span", { class: "hint" }, "");

        const valEl = h("div", { class: "val" });
        const minusB = h("button", { class: "btn big_b ghost", "data-act": "minus" });
        const plusB = h("button", { class: "btn big_b", "data-act": "plus" });
        const undoB = h("button", { class: "btn sm ghost", "data-act": "undo" }, "undo");
        const resetB = h("button", { class: "btn sm ghost" }, "reset");
        const amtEl = h("input", {
          type: "number",
          class: "amt",
          step: "any",
          placeholder: "one-off amount",
        });
        const setEl = h("input", {
          type: "number",
          class: "num",
          step: "any",
          placeholder: "value",
        });
        const intEl = h("input", {
          type: "number",
          class: "num",
          min: "1",
          step: "any",
          value: it.interval,
        });
        const histView = makeHistView(it);
        const noteWrap = h("div", {});

        const statusEl = h("div", { class: "slot_save" });
        const sumEl = h("div", { class: "slot_sum" });
        const reloadBtn = h(
          "button",
          {
            class: "btn sm ghost",
            onclick: () => {
              const fresh = readShift();
              if (fresh && Array.isArray(fresh.tags)) {
                sh = fresh;
                refresh();
                flash("reloaded");
              } else flash("shift.mk data unavailable");
            },
          },
          "↻ reload",
        );
        const syncBtn = h(
          "button",
          { class: "btn sm", onclick: syncCurrentSlot },
          "↻ sync to shift",
        );
        const todayBtn = h(
          "button",
          {
            class: "btn sm ghost",
            onclick: () => {
              it.date = null;
              it.slotKey = null;
              save();
              refresh();
            },
          },
          "today · now",
        );

        const curDate = () => it.date || todayYMD();

        function curSlot() {
          const date = curDate();
          if (it.slotKey) {
            const g = shiftGrid(sh, date).find((x) => x.key === it.slotKey);
            if (g) return g;
          }
          return shiftCurrentSlot(sh, date);
        }

        function getSlotState() {
          const g = curSlot();
          if (!g) return null;
          const s = shiftDay(sh, curDate()).slots[g.key] || {};
          const tag = s.tag && sh.tags.find((t) => t.id === s.tag);
          return { g, s, tag };
        }
        function isActiveSlot() {
          if (curDate() !== todayYMD()) return false;
          const g = curSlot();
          if (!g) return false;
          const d = new Date();
          const m = d.getHours() * 60 + d.getMinutes();
          return m >= g.start && m < g.end;
        }
        function fillSlots() {
          const grid = shiftGrid(sh, curDate());
          const sig = grid.map((g) => g.key).join("|");
          if (slotSel._sig !== sig) {
            slotSel._sig = sig;
            slotSel.innerHTML = "";
            for (const g of grid)
              slotSel.append(h("option", { value: g.key }, fmtRangeOT(g)));
          }
          const g = curSlot();
          if (g) slotSel.value = g.key;
          else if (grid[0]) slotSel.value = grid[0].key;
        }
        function fillTags() {
          const sig = sh.tags
            .map(
              (t) =>
                t.id +
                ":" +
                t.name +
                ":" +
                (t.prod ? "1" : "0") +
                ":" +
                (t.quota ?? ""),
            )
            .join("|");
          if (tagSel._sig !== sig) {
            tagSel._sig = sig;
            const keep = tagSel.value;
            tagSel.innerHTML = "";
            tagSel.append(h("option", { value: "" }, "—"));
            const sorted = [...sh.tags].sort(
              (a, b) => (b.prod ? 1 : 0) - (a.prod ? 1 : 0),
            );
            sorted.forEach((t) => {
              const lbl =
                t.name +
                (t.prod && t.quota
                  ? " · " + t.quota + "/h"
                  : t.prod
                    ? ""
                    : " (non-prod)");
              tagSel.append(h("option", { value: t.id }, lbl));
            });
            if (keep && sh.tags.some((t) => t.id === keep)) tagSel.value = keep;
          }
        }
        function flash(msg, ok) {
          statusEl.textContent = msg;
          statusEl.className = "slot_save" + (ok ? " ok" : "");
          setTimeout(() => {
            if (statusEl.textContent === msg) {
              statusEl.textContent = "";
              statusEl.className = "slot_save";
            }
          }, 1500);
        }

        function paintNote() {
          noteWrap.innerHTML = "";
          const n = it.noteId && get(it.noteId);
          if (n) noteWrap.append(panel(n, true));
          else
            noteWrap.append(
              h(
                "button",
                {
                  class: "btn sm ghost",
                  onclick: () => {
                    if (create("notepad", it.id)) render();
                  },
                },
                "+ attach notepad",
              ),
            );
        }

        function paintCounter() {
          const st = getSlotState();
          if (!st) {
            valEl.textContent = "—";
            return;
          }
          valEl.textContent = String(+st.s.tickets || 0);
          const iv = it.interval || 1;
          plusB.textContent = "+ " + iv;
          minusB.textContent = "− " + iv;
          undoB.disabled = !it.history.length;
          histView.paint();
        }

        function updateSummary() {
          const date = curDate();
          const d = shiftDay(sh, date);
          const grid = shiftGrid(sh, date);
          let logged = 0,
            otLogged = 0,
            tk = 0,
            ph = 0;
          for (const g of grid) {
            const s = d.slots[g.key];
            if (!s || !s.tag) continue;
            const tag = sh.tags.find((t) => t.id === s.tag);
            if (!tag) continue;
            const eff = shiftEffMin(sh, date, g);
            const m =
              s.mins == null ? eff : Math.min(Math.max(0, s.mins), g.def);
            const hrs = m / 60;
            logged++;
            if (g.zone) otLogged++;
            if (tag.prod) {
              ph += hrs;
              tk += +s.tickets || 0;
            }
          }
          sumEl.innerHTML = "";
          sumEl.append(
            document.createTextNode("day · "),
            h("b", {}, String(tk)),
            document.createTextNode(" tickets · "),
            h("b", {}, ph.toFixed(2)),
            document.createTextNode(" prod hrs · "),
            h("b", {}, ph > 0 ? (tk / ph).toFixed(2) : "0.00"),
            document.createTextNode("/hr · "),
            h("b", {}, String(logged)),
            document.createTextNode("/" + grid.length + " slots logged"),
          );
          if (otLogged)
            sumEl.append(
              document.createTextNode("  ·  "),
              h("b", {}, String(otLogged)),
              document.createTextNode(" OT slots"),
            );
        }

        function refresh() {
          const fresh = readShift();
          if (fresh && Array.isArray(fresh.tags)) sh = fresh;

          const date = curDate();
          const g = curSlot();
          if (!g) return;

          if (!it.slotKey) {
            it.slotKey = g.key;
            save();
          }

          const d = shiftDay(sh, date);
          const st = getSlotState();
          const s = st.s;

          const autoName = fmtSlotTitle(date, g);
          if (it.name !== autoName) {
            it.name = autoName;
            save();
          }

          dateIn.value = date;
          fillSlots();
          slotSel.value = g.key;
          slotBig.textContent = fmtRange(g);
          if (g.zone) {
            slotOT.textContent = g.zone === "pre" ? "PRE-OT" : "POST-OT";
            slotOT.style.display = "";
          } else slotOT.style.display = "none";

          const otlbl = otText(d);
          slotMeta.textContent =
            fmtDate(date) +
            " · shift " +
            d.start +
            " → " +
            d.end +
            (otlbl ? " · " + otlbl : "") +
            " · " +
            (d.iv || sh.cfg.interval) + " min slots";
          liveTag.style.display = isActiveSlot() ? "" : "none";

          const cd = countdownState(date, g);
          cdEl.textContent = cd.text;
          cdEl.className = "slot_cd " + cd.state;

          fillTags();
          tagSel.value = s.tag || "";
          const eff = shiftEffMin(sh, date, g);
          const br = shiftBreaks(sh, date, g);
          minIn.value = s.mins == null ? "" : s.mins;
          minIn.placeholder = String(eff);
          minHint.textContent =
            br > 0 ? "break −" + br + "m → " + eff + "m available" : "";

          paintNote();
          paintCounter();
          updateSummary();
        }

        function syncCurrentSlot() {
          const date = curDate();
          const g = curSlot();
          if (!g) {
            flash("no slot selected");
            return;
          }

          const fresh = readShift();
          if (!fresh || !Array.isArray(fresh.tags)) {
            flash("shift data unavailable");
            return;
          }
          if (!fresh.days) fresh.days = {};
          if (!fresh.days[date]) fresh.days[date] = {};
          if (!fresh.days[date].slots) fresh.days[date].slots = {};

          const cur = fresh.days[date].slots[g.key] || {};
          if (tagSel.value) cur.tag = tagSel.value;
          else delete cur.tag;

          if (minIn.value === "" || isNaN(+minIn.value)) delete cur.mins;
          else cur.mins = Math.max(0, +minIn.value);

          fresh.days[date].slots[g.key] = cur;
          if (!writeShift(fresh)) {
            flash("sync failed");
            return;
          }

          sh = fresh;
          save();
          refresh();
          flash("synced to shift", true);
        }

        function writeTickets(newVal, label) {
          const date = curDate();
          const g = curSlot();
          if (!g) return;
          const fresh = readShift() || sh;
          if (!fresh.days) fresh.days = {};
          if (!fresh.days[date]) fresh.days[date] = {};
          if (!fresh.days[date].slots) fresh.days[date].slots = {};
          const cur = fresh.days[date].slots[g.key] || {};
          const prev = +cur.tickets || 0;
          const next = Math.max(0, Math.floor(newVal));
          if (prev === next) return;
          cur.tickets = next;
          fresh.days[date].slots[g.key] = cur;
          if (writeShift(fresh)) {
            sh = fresh;
            pushHist(it, { prev, next, label, ts: Date.now() });
            save();
            paintCounter();
            updateSummary();
          } else {
            flash("write failed");
          }
        }

        plusB.onclick = () => {
          const st = getSlotState();
          if (!st) return;
          writeTickets(
            (+st.s.tickets || 0) + (it.interval || 1),
            "+" + (it.interval || 1),
          );
        };
        minusB.onclick = () => {
          const st = getSlotState();
          if (!st) return;
          writeTickets(
            (+st.s.tickets || 0) - (it.interval || 1),
            "−" + (it.interval || 1),
          );
        };
        undoB.onclick = () => {
          const x = it.history.pop();
          if (!x) return;
          const date = curDate();
          const g = curSlot();
          if (!g) return;
          const fresh = readShift() || sh;
          if (!fresh.days[date]) fresh.days[date] = {};
          if (!fresh.days[date].slots) fresh.days[date].slots = {};
          const cur = fresh.days[date].slots[g.key] || {};
          cur.tickets = x.prev;
          fresh.days[date].slots[g.key] = cur;
          if (writeShift(fresh)) {
            sh = fresh;
            save();
            paintCounter();
            updateSummary();
          }
        };
        resetB.onclick = () => writeTickets(0, "reset");

        const doOneOff = (sign) => {
          const n = parseFloat(amtEl.value);
          if (isNaN(n)) return;
          const st = getSlotState();
          if (!st) return;
          writeTickets(
            (+st.s.tickets || 0) + sign * Math.abs(n),
            (sign > 0 ? "+" : "−") + Math.abs(n),
          );
          amtEl.value = "";
        };
        const doSet = () => {
          const v = parseFloat(setEl.value);
          if (isNaN(v)) return;
          writeTickets(v, "set " + v);
          setEl.value = "";
        };

        intEl.onchange = () => {
          const v = parseFloat(intEl.value);
          if (v > 0) it.interval = v;
          else intEl.value = it.interval;
          save();
          paintCounter();
        };

        dateIn.onchange = () => {
          it.date =
            dateIn.value && dateIn.value !== todayYMD() ? dateIn.value : null;
          it.slotKey = null;
          save();
          refresh();
        };
        slotSel.onchange = () => {
          it.slotKey = slotSel.value || null;
          save();
          refresh();
        };

        tagSel.onchange = () => {
          const date = curDate();
          const g = curSlot();
          if (!g) return;
          const fresh = readShift() || sh;
          if (!fresh.days) fresh.days = {};
          if (!fresh.days[date]) fresh.days[date] = {};
          if (!fresh.days[date].slots) fresh.days[date].slots = {};
          const cur = fresh.days[date].slots[g.key] || {};
          if (tagSel.value) cur.tag = tagSel.value;
          else delete cur.tag;
          fresh.days[date].slots[g.key] = cur;
          if (writeShift(fresh)) {
            sh = fresh;
            save();
            paintCounter();
            updateSummary();
            flash("tag saved", true);
          } else flash("tag save failed");
        };
        minIn.onchange = () => {
          const date = curDate();
          const g = curSlot();
          if (!g) return;
          const fresh = readShift() || sh;
          if (!fresh.days) fresh.days = {};
          if (!fresh.days[date]) fresh.days[date] = {};
          if (!fresh.days[date].slots) fresh.days[date].slots = {};
          const cur = fresh.days[date].slots[g.key] || {};
          if (minIn.value === "" || isNaN(+minIn.value)) delete cur.mins;
          else cur.mins = Math.max(0, +minIn.value);
          fresh.days[date].slots[g.key] = cur;
          if (writeShift(fresh)) {
            sh = fresh;
            save();
            updateSummary();
            flash("minutes saved", true);
          }
        };

        fillTags();
        refresh();
        wrap._slotRefresh = refresh;

        wrap.append(
          h("div", { class: "slot_head" }, slotBig, slotOT, liveTag),
          slotMeta,

          h(
            "div",
            { class: "slot_cd_row" },
            h("span", { class: "slot_cd_label" }, "time left"),
            cdEl,
          ),

          h("div", { class: "sub_t" }, "tickets"),
          valEl,
          h("div", { class: "row2 c" }, minusB, plusB),
          h("div", { class: "hint", style: "text-align:center" }, "keys: space or + add · − subtract · u undo"),
          h("div", { class: "row2 c", style: "margin-top:6px" }, resetB, undoB),

          h("div", { class: "sub_t" }, "quick"),
          h(
            "div",
            { class: "row2" },
            h("span", { class: "hint" }, "increment"),
            intEl,
          ),
          h(
            "div",
            { class: "row2" },
            amtEl,
            h("button", { class: "btn sm", onclick: () => doOneOff(1) }, "add"),
            h(
              "button",
              { class: "btn sm ghost", onclick: () => doOneOff(-1) },
              "subtract",
            ),
          ),
          h(
            "div",
            { class: "row2" },
            setEl,
            h("button", { class: "btn sm", onclick: doSet }, "set"),
          ),

          h("div", { class: "sub_t" }, "slot"),
          h(
            "div",
            { class: "slot_bar" },
            h("div", { class: "f" }, h("label", {}, "date"), dateIn),
            h("div", { class: "f" }, h("label", {}, "slot"), slotSel),
            h("div", { class: "f" }, h("label", {}, "tag"), tagSel),
          ),
          h(
            "div",
            { class: "slot_bar", style: "margin-top:6px" },
            h("div", { class: "f" }, h("label", {}, "minutes"), minIn, minHint),
          ),
          h(
            "div",
            { class: "row2", style: "margin-top:8px" },
            statusEl,
            syncBtn,
            todayBtn,
            reloadBtn,
            h(
              "a",
              {
                href: "shift.html",
                class: "hint",
                style: "margin-left:auto;text-decoration:underline",
              },
              "open shift.mk →",
            ),
          ),

          h("div", { class: "sub_t" }, "note"),
          noteWrap,

          h("div", { class: "sub_t" }, "day totals"),
          sumEl,

          h("div", { class: "sub_t" }, "history"),
          histView.wrap,
        );

        return wrap;
      };

      /* ---------- generic shell ---------- */
      function panel(it, nested) {
        const headKids = [h("span", { class: "tag" }, it.type)];
        if (it.type !== "slot") {
          const nm = h("input", { class: "nm", value: it.name });
          nm.oninput = () => {
            it.name = nm.value;
            save();
          };
          nm.onblur = () => {
            if (!nm.value.trim()) {
              it.name = defName(it.type);
              nm.value = it.name;
              save();
            }
          };
          headKids.push(nm);
        }
        const acts = [];
        if (nested)
          acts.push(
            h(
              "button",
              { class: "btn sm ghost", onclick: () => detach(it) },
              "detach",
            ),
          );
        acts.push(
          h(
            "button",
            {
              class: "btn sm ghost",
              onclick: () => {
                if (
                  !confirm(
                    'Delete "' +
                      it.name +
                      '"' +
                      (it.noteId || it.timerId ? " and its attachments" : "") +
                      "?",
                  )
                )
                  return;
                del(it.id);
                nested ? render() : go(null);
              },
            },
            "delete",
          ),
        );
        headKids.push(...acts);
        return h(
          "section",
          { class: "panel mod" + (nested ? " nested" : "") },
          h("div", { class: "dhead" }, ...headKids),
          MOD[it.type](it),
        );
      }

      /* ---------- overview ---------- */
      function summary(it) {
        if (it.type === "notepad") {
          const t = it.text.trim();
          return h(
            "p",
            { class: "pv" },
            t ? t.slice(0, 90) + (t.length > 90 ? "…" : "") : "(empty)",
          );
        }
        if (it.type === "timer")
          return h(
            "div",
            { class: "sm_t" },
            h("b", { "data-tm": it.id }),
            " ",
            it.mode === "down" ? "countdown" : "stopwatch",
            it.t0 ? " · running" : "",
          );
        if (it.type === "slot") {
          const sh = readShift();
          if (!sh)
            return h("div", { class: "hint" }, "shift.mk not set up yet");
          const date = it.date || todayYMD();
          const g = shiftResolveSlot(sh, date, it.slotKey);
          if (!g) return h("div", { class: "hint" }, "no slot");
          const dd = shiftDay(sh, date);
          const s = dd.slots[g.key] || {};
          const tag = s.tag && sh.tags.find((t) => t.id === s.tag);
          const tickets = +s.tickets || 0;
          const n = it.noteId && get(it.noteId);
          const meta = [];
          if (tag) meta.push(tag.name);
          if (g.zone) meta.push(g.zone === "pre" ? "PRE-OT" : "POST-OT");
          if (n) meta.push("note: " + (n.text.trim().slice(0, 30) || "empty"));
          return h(
            "div",
            {},
            h("b", { class: "cnt" }, String(tickets)),
            h("span", { class: "hint" }, " tickets"),
            meta.length
              ? h("div", { class: "hint" }, meta.join(" · "))
              : h("div", { class: "hint" }, "no tag yet"),
          );
        }
        const n = it.noteId && get(it.noteId),
          t = it.timerId && get(it.timerId);
        return h(
          "div",
          {},
          h("b", { class: "cnt" }, String(it.value)),
          h("span", { class: "hint" }, "  +" + it.interval),
          n || t
            ? h(
                "div",
                { class: "hint" },
                n ? "note: " + (n.text.trim().slice(0, 40) || "empty") : "",
                n && t ? " · " : "",
                t ? h("span", { "data-tm": t.id }) : "",
                t && t.t0 ? " ▶" : "",
              )
            : null,
        );
      }
      function card(it) {
        return h(
          "div",
          { class: "card item", onclick: () => go(it.id) },
          h(
            "span",
            { class: "tag" },
            it.type + (it.noteId || it.timerId ? " +" : ""),
          ),
          h("h3", {}, it.name),
          summary(it),
        );
      }
      function overview() {
        const top = S.items.filter((x) => !x.parent);
        return h(
          "div",
          {},
          h(
            "div",
            { class: "bar" },
            h(
              "div",
              { class: "addrow" },
              ["counter", "notepad", "timer", "slot"].map((t) =>
                h(
                  "button",
                  {
                    class: "btn sm",
                    onclick: () => {
                      const it = create(t);
                      if (it) go(it.id);
                    },
                  },
                  "+ " + t,
                ),
              ),
            ),
            h(
              "div",
              { class: "seg" },
              ["grid", "list"].map((v) =>
                h(
                  "button",
                  {
                    class: S.view === v ? "on" : "",
                    onclick: () => {
                      S.view = v;
                      save();
                      render();
                    },
                  },
                  v,
                ),
              ),
            ),
          ),
          top.length
            ? h("div", { class: "items " + S.view }, top.map(card))
            : h(
                "p",
                { class: "hint" },
                "Nothing yet. Add a counter, notepad, timer or time slot above.",
              ),
        );
      }

      /* ---------- advanced data view (full JSON export / import) ---------- */
      function dataView() {
        const bundle = exportBundle();
        const expBytes = new Blob([JSON.stringify(bundle, null, 2)]).size;
        const nItems = (S.items || []).length;
        const hasShift = !!bundle.shift;
        const shDays =
          hasShift && bundle.shift.days
            ? Object.keys(bundle.shift.days).length
            : 0;
        const shTags =
          hasShift && Array.isArray(bundle.shift.tags)
            ? bundle.shift.tags.length
            : 0;

        const statusTop = h("div", { class: "data_status" });

        const exp = h("textarea", {
          class: "data_io tall",
          readonly: "readonly",
          spellcheck: "false",
        });
        exp.value = JSON.stringify(exportBundle(), null, 2);

        const copyBtn = h("button", { class: "btn sm" }, "copy to clipboard");
        copyBtn.onclick = async () => {
          const ok = await copyText(JSON.stringify(exportBundle(), null, 2));
          statusTop.textContent = ok
            ? "copied ✓ — paste it into the other machine"
            : "copy blocked — select all and Ctrl/Cmd+C instead";
          statusTop.className = "data_status " + (ok ? "ok" : "err");
          if (!ok) {
            exp.focus();
            exp.select();
          }
        };

        const dlBtn = h("button", { class: "btn sm ghost" }, "download .json");
        dlBtn.onclick = () => {
          const name = "tally-backup-" + todayYMD() + ".json";
          downloadText(
            name,
            JSON.stringify(exportBundle(), null, 2),
            "application/json",
          );
          statusTop.textContent = "downloaded " + name;
          statusTop.className = "data_status ok";
        };

        const selAll = h("button", { class: "btn sm ghost" }, "select all");
        selAll.onclick = () => {
          exp.focus();
          exp.select();
        };

        const imp = h("textarea", {
          class: "data_io tall",
          spellcheck: "false",
          placeholder: "paste a tally backup JSON here…",
        });
        const impStatus = h("div", { class: "data_status" });

        const doImport = h("button", { class: "btn sm" }, "import");
        doImport.onclick = () => {
          const t = imp.value.trim();
          if (!t) {
            impStatus.textContent = "nothing to import — paste a backup first";
            impStatus.className = "data_status err";
            return;
          }
          if (
            !confirm(
              "Importing will replace all current tally.mk data in this browser (and shift.mk data if the backup includes it). Continue?",
            )
          )
            return;
          try {
            const r = importBundle(t);
            impStatus.textContent =
              "imported ✓" +
              (r.shift ? " (tally + shift.mk)" : " (tally only)");
            impStatus.className = "data_status ok";
            buildCustomBar();
            syncCustomInputs();
            applyTheme();
            renderThemebar();
            render();
          } catch (err) {
            impStatus.textContent = "import failed: " + err.message;
            impStatus.className = "data_status err";
          }
        };

        const clearImp = h("button", { class: "btn sm ghost" }, "clear");
        clearImp.onclick = () => {
          imp.value = "";
          impStatus.textContent = "";
          impStatus.className = "data_status";
        };

        return h(
          "div",
          { class: "data_wrap" },
          h(
            "button",
            {
              class: "btn sm ghost",
              style: "align-self:flex-start",
              onclick: () => go(null),
            },
            "← back",
          ),
          h("h2", { class: "data_h" }, "export / import (full JSON)"),
          h(
            "p",
            { class: "hint" },
            "Advanced view. For everyday backups use the compact “data” button in the toolbar. This one shows the full uncompressed JSON, including history.",
          ),

          h(
            "div",
            { class: "data_meta" },
            h("b", {}, String(nItems)),
            " items · ",
            h("b", {}, hasShift ? String(shTags) : "0"),
            " shift tags · ",
            h("b", {}, hasShift ? String(shDays) : "0"),
            " days of shift data · ",
            h("b", {}, (expBytes / 1024).toFixed(1)),
            " KB",
          ),

          h("div", { class: "sub_t" }, "theme"),
          h(
            "p",
            { class: "hint" },
            "Click the last swatch in the toolbar (or the swatches below) to pick a preset. Choose Custom and the color pickers appear in the toolbar — changes apply live. The theme travels inside the tally backup.",
          ),
          h(
            "div",
            { class: "row2" },
            ...[
              ["bg", "background"],
              ["panel", "rows"],
              ["txt", "text"],
              ["acc", "accent"],
            ].map(([k, l]) =>
              h(
                "label",
                { class: "hint cc2" },
                l,
                h("input", {
                  type: "color",
                  "data-cc": k,
                  value: "#" + S.custom[k],
                }),
              ),
            ),
            h(
              "button",
              {
                class: "btn sm ghost",
                onclick: () => {
                  S.custom = { ...DEFTHEME };
                  save();
                  applyTheme();
                  syncCustomInputs();
                  renderThemebar();
                  render();
                },
              },
              "reset custom",
            ),
          ),

          h("div", { class: "sub_t" }, "export"),
          h("div", { class: "row2" }, copyBtn, dlBtn, selAll, statusTop),
          exp,

          h("div", { class: "sub_t" }, "import"),
          h(
            "p",
            { class: "hint" },
            "Paste a full JSON backup below and press import. This will replace the tally.mk data in this browser. If the backup was made by this version, it also carries shift.mk tags, breaks and interval tickets — so slot cards work immediately.",
          ),
          imp,
          h("div", { class: "row2" }, doImport, clearImp, impStatus),
        );
      }

      /* ---------- routing ---------- */
      function go(id) {
        route = id;
        save();
        render();
        window.scrollTo(0, 0);
      }
      function render() {
        const m = $("main");
        if (route === "_data") {
          m.replaceChildren(dataView());
        } else {
          const it = route && get(route);
          m.replaceChildren(
            it
              ? h(
                  "div",
                  { class: "detail" },
                  h(
                    "button",
                    {
                      class: "btn sm ghost",
                      style: "align-self:flex-start",
                      onclick: () => go(null),
                    },
                    "← all",
                  ),
                  panel(it, false),
                )
              : overview(),
          );
          if (!it) route = null;
        }
        tick();
      }

      /* ---------- events ---------- */
      document.addEventListener("click", (e) => {
        const th = e.target.closest("[data-th]");
        if (th) {
          S.theme = th.dataset.th;
          save();
          applyTheme();
          renderThemebar();
          return;
        }
      });

      document.addEventListener("input", (e) => {
        const t = e.target;
        if (!t.dataset || !t.dataset.cc) return;
        S.custom[t.dataset.cc] = hex6(t.value.slice(1), S.custom[t.dataset.cc]);
        S.theme = "custom";
        applyTheme();
        syncCustomInputs(t);
        showCustomBar();
        save();
      });

      document.addEventListener("change", (e) => {
        const t = e.target;
        if (!t.dataset || !t.dataset.cc) return;
        renderThemebar();
      });

      window.addEventListener("focus", () => {
        document.querySelectorAll("[data-slot]").forEach((n) => {
          if (n._slotRefresh) n._slotRefresh();
        });
      });
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden)
          document.querySelectorAll("[data-slot]").forEach((n) => {
            if (n._slotRefresh) n._slotRefresh();
          });
      });
      window.addEventListener("storage", (e) => {
        if (e.key !== SHIFT_KEY) return;
        document.querySelectorAll("[data-slot]").forEach((n) => {
          if (n._slotRefresh) n._slotRefresh();
        });
      });

      /* ---------- shared backup: identical in tally + shift ---------- */
      window.mkBackupAdvanced = () => go("_data");
      (function(){
        const KEYS = {t:'tally.v1', s:'shift.v1'};
        const HAS = typeof CompressionStream !== 'undefined';
        const toB64 = u8 => { let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
          return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
        const fromB64 = b => { b=b.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; const s=atob(b), u=new Uint8Array(s.length);
          for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
        const pipe = async (u8, st) => new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(st)).arrayBuffer());

        async function pack(withHist){
          const o = {};
          for(const k in KEYS){
            const raw = localStorage.getItem(KEYS[k]); if(!raw) continue;
            let v; try{ v = JSON.parse(raw); }catch(_){ continue; }
            if(!withHist && k==='t' && Array.isArray(v.items)) v.items.forEach(i=>{ if(i.history) i.history = []; });
            o[k] = v;
          }
          const u8 = new TextEncoder().encode(JSON.stringify(o));
          return HAS ? 'MK1.'+toB64(await pipe(u8, new CompressionStream('deflate-raw'))) : 'MK0.'+toB64(u8);
        }

        async function unpack(txt){
          txt = txt.trim();
          let o;
          if(/^MK[01]\./.test(txt)){
            let u8 = fromB64(txt.slice(4).replace(/\s+/g,''));
            if(txt[2]==='1') u8 = await pipe(u8, new DecompressionStream('deflate-raw'));
            o = JSON.parse(new TextDecoder().decode(u8));
          } else {
            o = JSON.parse(txt);                                   // legacy formats
            if(o && o.v===1 && o.tally) o = {t:o.tally, s:o.shift};  // old tally bundle
            else if(o && Array.isArray(o.items)) o = {t:o};          // old tally-only
            else if(o && o.days && o.tags) o = {s:o};                // old shift backup
          }
          if(!o || (!o.t && !o.s)) throw new Error('unrecognized backup');
          if(o.t && !Array.isArray(o.t.items)) throw new Error('bad tally data');
          if(o.s && (!o.s.days || !o.s.tags)) throw new Error('bad shift data');
          return o;
        }

        const css = '#mkdlg{background:var(--panel);color:var(--txt);border:2px solid var(--line);padding:18px;width:min(560px,94vw);font-family:var(--mono);font-size:12px}'+
          '#mkdlg::backdrop{background:rgba(0,0,0,.65)}'+
          '#mkdlg h2{font-family:var(--display);font-size:15px;margin:0 0 4px;letter-spacing:1px}'+
          '#mkdlg textarea{width:100%;height:84px;resize:vertical;box-sizing:border-box;background:var(--panel2);border:2px solid var(--line);color:var(--txt);font-family:var(--mono);font-size:11px;padding:8px;word-break:break-all}'+
          '#mkdlg textarea:focus{outline:none;border-color:var(--blood)}'+
          '#mkdlg .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}'+
          '#mkdlg .h{color:var(--dim);font-size:11px}'+
          '#mkdlg .st{min-height:1.2em;font-size:11px;color:var(--dim)}'+
          '#mkdlg .st.ok{color:#34d399}#mkdlg .st.err{color:#f87171}'+
          '#mkdlg .t{color:var(--blood);font-size:.7rem;letter-spacing:2px;text-transform:uppercase;margin-top:12px}';
        const st = document.createElement('style'); st.textContent = css; document.head.append(st);

        const dlg = document.createElement('dialog'); dlg.id = 'mkdlg';
        dlg.innerHTML =
          '<h2>data backup</h2><div class="h">Backs up tally + shift together. Copy on one side, paste on the other. Works from either page.</div>'+
          '<div class="t">export</div>'+
          '<textarea id="mkx" readonly spellcheck="false"></textarea>'+
          '<div class="r"><button class="btn sm" id="mkcp">copy</button>'+
          '<label class="h"><input type="checkbox" id="mkh"> include history (longer)</label>'+
          '<span class="h" id="mkn"></span></div>'+
          '<div class="t">import</div>'+
          '<textarea id="mki" spellcheck="false" placeholder="paste backup here…"></textarea>'+
          '<div class="r"><button class="btn sm" id="mkgo">import &amp; reload</button>'+
          '<button class="btn sm ghost" id="mkadv" style="display:none">advanced</button>'+
          '<button class="btn sm ghost" id="mkclose" style="margin-left:auto">close</button></div>'+
          '<div class="st" id="mkst"></div>';
        document.body.append(dlg);
        const $$ = id => dlg.querySelector('#'+id);
        const say = (m, c) => { const s=$$('mkst'); s.textContent = m; s.className = 'st '+(c||''); };

        async function fill(){
          const t = await pack($$('mkh').checked);
          $$('mkx').value = t; $$('mkn').textContent = t.length.toLocaleString()+' chars';
        }
        $$('mkh').onchange = fill;
        $$('mkcp').onclick = async () => {
          const t = $$('mkx').value; let ok = false;
          try{ await navigator.clipboard.writeText(t); ok = true; }
          catch(_){ $$('mkx').select(); try{ ok = document.execCommand('copy'); }catch(_2){} }
          say(ok ? 'copied' : 'copy blocked, text is selected, use ctrl/cmd+c', ok ? 'ok' : 'err');
        };
        $$('mkgo').onclick = async () => {
          const t = $$('mki').value.trim(); if(!t) return say('paste something first','err');
          let o; try{ o = await unpack(t); }catch(e){ return say('import failed: '+e.message,'err'); }
          const what = [o.t&&'tally', o.s&&'shift'].filter(Boolean).join(' + ');
          if(!confirm('Replace current '+what+' data in this browser?')) return;
          try{
            if(o.t) localStorage.setItem(KEYS.t, JSON.stringify(o.t));
            if(o.s) localStorage.setItem(KEYS.s, JSON.stringify(o.s));
          }catch(e){ return say('write failed: '+e.message,'err'); }
          window.__mkSkip = true;           // stop pagehide save() from overwriting the import
          say('imported '+what+', reloading…','ok');
          setTimeout(()=>location.reload(), 300);
        };
        $$('mkclose').onclick = () => dlg.close();
        if(window.mkBackupAdvanced){ const a=$$('mkadv'); a.style.display=''; a.onclick=()=>{ dlg.close(); window.mkBackupAdvanced(); }; }
        dlg.addEventListener('click', e => { if(e.target===dlg) dlg.close(); });

        document.addEventListener('click', async e => {
          if(!e.target.closest('[data-data]')) return;
          e.preventDefault();
          if(dlg.open) return;
          $$('mki').value = ''; say('');
          await fill(); dlg.showModal();
        });
      })();

      /* ---------- keyboard: space / + add, - subtract, u undo (counter + slot pages) ---------- */
/* A web page only sees keys while its tab is focused, so true global hotkeys are not possible.
   These work the moment you alt-tab back, without needing a button to be focused first. */
(function () {
  const typing = (t) =>
    t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  const map = { " ": "plus", "+": "plus", "=": "plus", "-": "minus", "_": "minus", u: "undo", U: "undo", z: "undo", Z: "undo" };
  const live = () => route && route !== "_data";
  document.addEventListener("keydown", (e) => {
    if (!live() || e.ctrlKey || e.metaKey || e.altKey || typing(e.target)) return;
    const a = map[e.key];
    if (!a) return;
    const b = document.querySelector('[data-act="' + a + '"]');
    if (!b) return;
    e.preventDefault();
    if (e.repeat) return;
    b.click();
  });
  /* stop a focused button from also firing its own click on Space release */
  document.addEventListener("keyup", (e) => {
    if (e.key === " " && live() && !typing(e.target) && document.querySelector('[data-act="plus"]'))
      e.preventDefault();
  });
})();

/* ---------- boot ---------- */
      applyTheme();
      buildCustomBar();
      renderThemebar();
      render();
    </script>
  </body>
</html>
